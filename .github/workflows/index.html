<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تحويل إكسل إلى VCF</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#f5f6fa;--card:#fff;--tx:#1b1f2a;--mut:#667085;--bd:#dfe3ec;--ac:#2f6df6;--ok:#12a150}
@media (prefers-color-scheme:dark){:root{--bg:#12141a;--card:#1b1e27;--tx:#eceef5;--mut:#9aa2b5;--bd:#2c3140;--ac:#5b8cff}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Segoe UI",Tahoma,Arial,sans-serif;line-height:1.6}
main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:1.5rem;margin:0 0 4px}
p.sub{color:var(--mut);margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:18px;margin-bottom:16px}
.card h2{font-size:1rem;margin:0 0 12px}
label{display:block;font-size:.9rem;color:var(--mut);margin-bottom:4px}
input[type=text],select{width:100%;padding:10px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
input[type=file]{width:100%;padding:18px;border:2px dashed var(--bd);border-radius:12px;background:var(--bg);color:var(--tx)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media(max-width:560px){.row{grid-template-columns:1fr}}
.chk{display:flex;align-items:center;gap:8px;margin-top:12px;color:var(--tx);font-size:.95rem}
button{width:100%;padding:13px;border:0;border-radius:12px;background:var(--ac);color:#fff;font:inherit;font-weight:600;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.tbl{overflow-x:auto;border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{padding:7px 10px;border-bottom:1px solid var(--bd);text-align:right;white-space:nowrap}
th{background:var(--bg);color:var(--mut);font-weight:600}
.msg{margin-top:12px;font-size:.92rem}
.msg.ok{color:var(--ok)}
.hidden{display:none}
</style>
</head>
<body>
<main>
  <h1>📇 تحويل ملف إكسل إلى جهات اتصال (VCF)</h1>
  <p class="sub">ارفع الملف، اختار عمود الأسماء وعمود الأرقام، اكتب الكلمة، وحمّل ملف VCF. كل المعالجة بتتم على جهازك.</p>

  <div class="card">
    <h2>1) ارفع ملف الإكسل</h2>
    <input type="file" id="file" accept=".xlsx,.xls,.csv,.ods">
    <div id="sheetWrap" class="hidden" style="margin-top:12px">
      <label>الشيت</label>
      <select id="sheet"></select>
    </div>
  </div>

  <div id="step2" class="hidden">
    <div class="card">
      <h2>2) اختار الأعمدة</h2>
      <div class="row">
        <div><label>عمود الأسماء</label><select id="nameCol"></select></div>
        <div><label>عمود الأرقام</label><select id="numCol"></select></div>
      </div>
      <label class="chk"><input type="checkbox" id="hasHeader" checked> أول صف فيه عناوين (مش بيانات)</label>
    </div>

    <div class="card">
      <h2>3) الكلمة المضافة للاسم</h2>
      <div class="row">
        <div><label>الكلمة</label><input type="text" id="word" placeholder="مثال: عميل"></div>
        <div><label>مكانها</label>
          <select id="pos"><option value="after">بعد الاسم</option><option value="before">قبل الاسم</option></select>
        </div>
      </div>
      <div style="margin-top:12px">
        <label>كود الدولة (اختياري) — مثال: +20 (بيضيفه للأرقام ويشيل الصفر الأول)</label>
        <input type="text" id="cc" placeholder="+20" dir="ltr">
      </div>
    </div>

    <div class="card">
      <h2>معاينة</h2>
      <div class="tbl"><table id="prev"></table></div>
      <div id="count" class="msg"></div>
      <div style="margin-top:14px"><button id="dl">تحميل ملف VCF</button></div>
      <div id="done" class="msg ok"></div>
    </div>
  </div>
</main>

<script>
let wb=null, rows=[];
const $=id=>document.getElementById(id);

$('file').addEventListener('change',async e=>{
  const f=e.target.files[0]; if(!f) return;
  try{
    wb=XLSX.read(await f.arrayBuffer(),{type:'array'});
  }catch(err){alert('مقدرتش أقرأ الملف');return;}
  $('sheet').innerHTML=wb.SheetNames.map((n,i)=>`<option value="${i}">${esc(n)}</option>`).join('');
  $('sheetWrap').classList.toggle('hidden',wb.SheetNames.length<2);
  loadSheet();
});
$('sheet').addEventListener('change',loadSheet);
['nameCol','numCol','hasHeader','word','pos','cc'].forEach(id=>$(id).addEventListener('input',render));
$('hasHeader').addEventListener('change',()=>{fillCols();render();});

function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));}
function colLetter(i){let s='';i++;while(i>0){const m=(i-1)%26;s=String.fromCharCode(65+m)+s;i=Math.floor((i-1)/26);}return s;}

function loadSheet(){
  const ws=wb.Sheets[wb.SheetNames[+$('sheet').value||0]];
  rows=XLSX.utils.sheet_to_json(ws,{header:1,defval:'',raw:true}).filter(r=>r.some(c=>String(c).trim()!==''));
  if(!rows.length){alert('الشيت فاضي');return;}
  $('step2').classList.remove('hidden');
  fillCols();render();
}
function fillCols(){
  const n=Math.max(...rows.map(r=>r.length));
  const hdr=$('hasHeader').checked, ref=rows[hdr?0:0], sample=rows[hdr?1:0]||[];
  const prevN=$('nameCol').value, prevM=$('numCol').value;
  let opts='';
  for(let i=0;i<n;i++){
    const label=hdr&&String(ref[i]??'').trim()?ref[i]:(sample[i]??'');
    opts+=`<option value="${i}">${colLetter(i)} — ${esc(String(label).slice(0,30))}</option>`;
  }
  $('nameCol').innerHTML=opts; $('numCol').innerHTML=opts;
  $('nameCol').value=prevN!==''&&prevN<n?prevN:0;
  $('numCol').value=prevM!==''&&prevM<n?prevM:Math.min(1,n-1);
}

function cleanNum(v){
  let s=String(v??'').trim();
  if(!s) return '';
  if(/e\+?\d+/i.test(s)&&!isNaN(+s)) s=BigInt(Math.round(+s)).toString();
  s=s.replace(/[\u0660-\u0669]/g,d=>d.charCodeAt(0)-0x660); // Arabic digits
  const plus=s.startsWith('+');
  s=s.replace(/\D/g,'');
  if(!s) return '';
  const cc=$('cc').value.replace(/\D/g,'');
  if(cc){
    if(plus||s.startsWith(cc)&&s.length>cc.length+7) return '+'+s;
    if(s.startsWith('00')) return '+'+s.slice(2);
    return '+'+cc+s.replace(/^0+/,'');
  }
  return (plus?'+':'')+s;
}

function contacts(){
  const ni=+$('nameCol').value, mi=+$('numCol').value, w=$('word').value.trim();
  const data=$('hasHeader').checked?rows.slice(1):rows;
  const out=[];
  for(const r of data){
    const name=String(r[ni]??'').trim(), num=cleanNum(r[mi]);
    if(!num) continue;
    const full=w?($('pos').value==='before'?`${w} ${name}`:`${name} ${w}`).trim():name;
    out.push({name:full||num,num});
  }
  return out;
}

function render(){
  if(!rows.length) return;
  const c=contacts();
  $('prev').innerHTML='<tr><th>الاسم</th><th>الرقم</th></tr>'+c.slice(0,6).map(x=>`<tr><td>${esc(x.name)}</td><td dir="ltr">${esc(x.num)}</td></tr>`).join('');
  $('count').textContent=`عدد جهات الاتصال: ${c.length}`;
  $('dl').disabled=!c.length;
  $('done').textContent='';
}

const vEsc=s=>s.replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,' ');
$('dl').addEventListener('click',()=>{
  const c=contacts();
  const vcf=c.map(x=>['BEGIN:VCARD','VERSION:3.0',`N:${vEsc(x.name)};;;;`,`FN:${vEsc(x.name)}`,`TEL;TYPE=CELL:${x.num}`,'END:VCARD'].join('\r\n')).join('\r\n')+'\r\n';
  const url=URL.createObjectURL(new Blob([vcf],{type:'text/vcard;charset=utf-8'}));
  const a=document.createElement('a'); a.href=url; a.download='contacts.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),2000);
  $('done').textContent=`✅ تم تحميل ${c.length} جهة اتصال`;
});
</script>
</body>
</html>
